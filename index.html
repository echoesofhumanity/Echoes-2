<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Humanity — Digital Civilization Without Borders</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: { 900: '#05070f', 800: '#0a0e1a', 700: '#131b2e' },
                        turquoise: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        /* Mat Lüks Cam Tasarımı (Neon Değil, Asil Lacivert/Gri) */
        .glass-header {
            background: rgba(5, 7, 15, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dil Küresi ve Menü Geçiş Sınıfları */
        .menu-hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .menu-visible { transform: translateY(0); opacity: 1; pointer-events: auto; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .lang-hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; transition: all 0.25s ease; }
        .lang-visible { opacity: 1; transform: translateY(0); pointer-events: auto; transition: all 0.25s ease; }
    </style>
</head>
<body class="bg-[#05070f] text-slate-100 font-sans antialiased min-h-screen relative selection:bg-turquoise-500 selection:text-white overflow-x-hidden">

    <!-- KİLİTLİ ÜST HEADER BÖLÜMÜ -->
    <header class="w-full glass-header sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
            
            <!-- Logo ve Marka -->
            <a href="index.html" class="flex items-center gap-3.5 group">
                <img src="logo.png" alt="Echoes of Humanity Logo" class="h-10 sm:h-12 w-auto object-contain">
                <div class="flex flex-col">
                    <span class="text-[10px] sm:text-[11px] tracking-[0.3em] text-slate-300 font-medium">ECHOES</span>
                    <span class="text-xs sm:text-sm font-bold tracking-wider text-white">OF HUMANITY</span>
                </div>
            </a>

            <!-- Sağ Kontroller (Dil Küresi ve Hamburger) -->
            <div class="flex items-center gap-3.5">
                
                <!-- DİL SEÇİCİ KÜRESİ -->
                <div class="relative">
                    <button type="button" onclick="window.toggleLangMenu(event)" aria-label="Language Selector" class="w-10 h-10 rounded-full border border-turquoise-500/30 bg-white/5 flex items-center justify-center text-slate-200 hover:bg-turquoise-500/20 hover:border-turquoise-400 transition-all text-xs font-mono cursor-pointer shadow-sm">
                        🌐
                    </button>
                    <!-- Bayraklar / Dil Seçenekleri (Nefes Alan Cam Blok) -->
                    <div id="langDropdown" class="absolute right-0 top-12 w-44 rounded-2xl bg-[#0a0e1a]/95 border border-white/10 backdrop-blur-2xl shadow-2xl lang-hidden py-2 z-50">
                        <button type="button" onclick="window.setLanguage('en')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors"><span>🇬🇧</span> <span class="font-medium">English</span></button>
                        <button type="button" onclick="window.setLanguage('tr')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors"><span>🇹🇷</span> <span class="font-medium">Türkçe</span></button>
                        <button type="button" onclick="window.setLanguage('ru')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors"><span>🇷🇺</span> <span class="font-medium">Русский</span></button>
                        <button type="button" onclick="window.setLanguage('de')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors"><span>🇩🇪</span> <span class="font-medium">Deutsch</span></button>
                        <button type="button" onclick="window.setLanguage('es')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors"><span>🇪🇸</span> <span class="font-medium">Español</span></button>
                    </div>
                </div>

                <!-- HAMBURGER MENÜ BUTONU -->
                <button type="button" onclick="window.toggleMobileMenu(event)" aria-label="Toggle Menu" class="w-10 h-10 rounded-full border border-turquoise-500/30 bg-white/5 flex flex-col items-center justify-center gap-1.5 text-slate-200 hover:bg-turquoise-500/20 hover:border-turquoise-400 transition-all cursor-pointer shadow-sm">
                    <span class="w-4 h-0.5 bg-slate-200 rounded-full"></span>
                    <span class="w-4 h-0.5 bg-slate-200 rounded-full"></span>
                    <span class="w-2.5 h-0.5 bg-slate-200 rounded-full self-start ml-3"></span>
                </button>

            </div>
        </div>
    </header>

    <!-- Global Etkileşim Scripti (Head/Header Bütünlüğü İçin) -->
    <script>
        window.toggleMobileMenu = function(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('mobileMenu');
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown) { langDropdown.classList.remove('lang-visible'); langDropdown.classList.add('lang-hidden'); }
            if (menu) {
                if (menu.classList.contains('menu-hidden')) {
                    menu.classList.remove('menu-hidden');
                    menu.classList.add('menu-visible');
                    document.body.style.overflow = 'hidden';
                } else {
                    menu.classList.remove('menu-visible');
                    menu.classList.add('menu-hidden');
                    document.body.style.overflow = 'auto';
                }
            }
        };

        window.toggleLangMenu = function(event) {
            if (event) event.stopPropagation();
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown) {
                if (langDropdown.classList.contains('lang-hidden')) {
                    langDropdown.classList.remove('lang-hidden');
                    langDropdown.classList.add('lang-visible');
                } else {
                    langDropdown.classList.remove('lang-visible');
                    langDropdown.classList.add('lang-hidden');
                }
            }
        };

        window.setLanguage = function(lang) {
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown) {
                langDropdown.classList.remove('lang-visible');
                langDropdown.classList.add('lang-hidden');
            }
        };

        window.addEventListener('click', function(e) {
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown && !langDropdown.contains(e.target)) {
                langDropdown.classList.remove('lang-visible');
                langDropdown.classList.add('lang-hidden');
            }
        });
    </script>
</body>
</html>
