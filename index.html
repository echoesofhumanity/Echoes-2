<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: {
                            900: '#05070f',
                            800: '#0a0e1a',
                            700: '#131b2e',
                        },
                        brand: {
                            teal: '#7ac1c3',
                            tealHover: '#95d3d5'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes ambientPulse {
            0%, 100% { opacity: 0.15; transform: scale(0.95); }
            50% { opacity: 0.35; transform: scale(1.05); }
        }
        .ambient-glow-1 { animation: ambientPulse 8s ease-in-out infinite; }
        .ambient-glow-2 { animation: ambientPulse 10s ease-in-out infinite 2s; }
        .ambient-glow-3 { animation: ambientPulse 9s ease-in-out infinite 4s; }

        @keyframes gentlePulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.04); opacity: 1; }
        }
        .breath-anim { animation: gentlePulse 5s ease-in-out infinite; }

        .dropdown-menu {
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
            transform: translateY(-40px); opacity: 0; pointer-events: none;
        }
        .dropdown-menu.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

        .backdrop-fade { transition: opacity 0.8s ease, visibility 0.8s ease; }

        /* Logo Özel Stil: Asil ve Sabit */
        .main-logo {
            height: 72px; /* 72px = h-18 */
            width: auto;
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.2)); /* Muted gold glow */
            transition: filter 0.4s ease;
        }
        .main-logo:hover { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.4)); }
    </style>
</head>
