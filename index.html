<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Humanity — Digital Civilization Without Borders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: { 900: '#05070f', 800: '#0a0e1a', 700: '#131b2e' },
                        turquoise: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        /* Organik Nefes Alma (Büyüyüp Küçülme) Animasyonları */
        @keyframes softPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.4);
            }
            50% {
                transform: scale(1.07);
                box-shadow: 0 0 18px 4px rgba(45, 212, 191, 0.3);
            }
        }
        @keyframes flagPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        @keyframes globalGlobePulse {
            0%, 100% { transform: scale(1); opacity: 0.35; }
            50% { transform: scale(1.12); opacity: 0.65; }
        }
        /* Logoda Bilinçaltı Yaşam Işıması (Nefes Alan Glow) */
        @keyframes lifeGlow {
            0%, 100% {
                filter: drop-shadow(0 0 4px rgba(45, 212, 191, 0.25));
            }
            50% {
                filter: drop-shadow(0 0 14px rgba(45, 212, 191, 0.6));
            }
        }

        .pulse-button {
            animation: softPulse 3.5s ease-in-out infinite;
        }
        .pulse-flag {
            animation: flagPulse 3.5s ease-in-out infinite;
            display: inline-block;
        }
        .pulse-globe {
            animation: globalGlobePulse 8s ease-in-out infinite;
        }
        .logo-life-glow {
            animation: lifeGlow 4s ease-in-out infinite;
        }

        .glass-header {
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Yavaş ve Sinematik Yukarıdan Aşağıya Açılma Animasyonu */
        .menu-hidden { 
            transform: translateY(-100%); 
            opacity: 0; 
            pointer-events: none; 
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease; 
        }
        .menu-visible { 
            transform: translateY(0); 
            opacity: 1; 
            pointer-events: auto; 
            transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease; 
        }
        
        .lang-hidden { opacity: 0; transform: translateY(-10px); pointer-events: none; transition: all 0.3s ease; }
        .lang-visible { opacity: 1; transform: translateY(0); pointer-events: auto; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#05070f] text-slate-100 font-sans antialiased min-h-screen relative selection:bg-turquoise-500 selection:text-white overflow-x-hidden">

    <!-- ARKA PLAN IŞIK KÜRESİ VE ATMOSFERİK DERİNLİK -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-[#05070f] via-[#0a0e1a] to-[#05070f]"></div>
        <div class="absolute top-[20%] left-1/2 -translate-x-1/2 w-[70vw] h-[70vw] max-w-[800px] max-h-[800px] rounded-full bg-turquoise-500/10 blur-[140px] pulse-globe"></div>
    </div>

    <!-- ANA KAPSAYICI -->
    <div class="relative z-10 flex flex-col min-h-screen">
        
        <!-- ================= BÖLÜM 1: HEADER (ÜST MENÜ) ================= -->
        <header class="w-full glass-header sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">
                
                <!-- Sol: Logo, Yaşam Işıması ve Güçlendirilmiş Kurumsal İsim -->
                <a href="#home" class="flex items-center gap-3.5 group">
                    <img src="logo.png" alt="Echoes of Humanity Logo" class="h-10 sm:h-12 w-auto object-contain logo-life-glow">
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-[11px] tracking-[0.3em] text-slate-300 font-medium">ECHOES</span>
                        <span class="text-xs sm:text-sm font-bold tracking-wider text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.2)]">OF HUMANITY</span>
                    </div>
                </a>

                <!-- Sağ: Nefes Alan Dil Küresi ve Hamburger Menü -->
                <div class="flex items-center gap-3.5">
                    
                    <!-- Dil Seçici ve 5 Dil Menüsü -->
                    <div class="relative">
                        <button onclick="toggleLangMenu()" aria-label="Language Selector" class="w-10 h-10 rounded-full border border-turquoise-500/40 bg-white/5 flex items-center justify-center text-slate-200 hover:bg-turquoise-500/20 hover:border-turquoise-400 transition-all text-base cursor-pointer pulse-button">
                            🌐
                        </button>
                        <!-- 5 Dilli Açılır Menü -->
                        <div id="langDropdown" class="absolute right-0 top-12 w-40 rounded-2xl bg-[#0a0e1a]/95 border border-white/10 backdrop-blur-2xl shadow-2xl lang-hidden py-2 z-50">
                            <button onclick="setLanguage('en')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors">
                                <span class="text-base pulse-flag">🇬🇧</span> <span class="font-medium">English</span>
                            </button>
                            <button onclick="setLanguage('tr')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors">
                                <span class="text-base pulse-flag" style="animation-delay: 0.7s;">🇹🇷</span> <span class="font-medium">Türkçe</span>
                            </button>
                            <button onclick="setLanguage('ru')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors">
                                <span class="text-base pulse-flag" style="animation-delay: 1.4s;">🇷🇺</span> <span class="font-medium">Русский</span>
                            </button>
                            <button onclick="setLanguage('de')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors">
                                <span class="text-base pulse-flag" style="animation-delay: 2.1s;">🇩🇪</span> <span class="font-medium">Deutsch</span>
                            </button>
                            <button onclick="setLanguage('es')" class="w-full px-4 py-2.5 text-left text-xs text-slate-200 hover:bg-white/10 flex items-center gap-3 transition-colors">
                                <span class="text-base pulse-flag" style="animation-delay: 2.8s;">🇪🇸</span> <span class="font-medium">Español</span>
                            </button>
                        </div>
                    </div>

                    <!-- Nefes Alan Hamburger Menü Butonu -->
                    <button onclick="toggleMobileMenu()" aria-label="Toggle Menu" class="w-10 h-10 rounded-full border border-turquoise-500/40 bg-white/5 flex flex-col items-center justify-center gap-1.5 text-slate-200 hover:bg-turquoise-500/20 hover:border-turquoise-400 transition-all cursor-pointer pulse-button">
                        <span class="w-4 h-0.5 bg-slate-200 rounded-full"></span>
                        <span class="w-4 h-0.5 bg-slate-200 rounded-full"></span>
                        <span class="w-2.5 h-0.5 bg-slate-200 rounded-full self-start ml-3"></span>
                    </button>

                </div>
            </div>
        </header>

        <!-- SİNEMATİK YUKARIDAN AŞAĞIYA İNEN 3 BÖLÜMLÜ NAVİGASYON PANELİ -->
        <div id="mobileMenu" class="fixed inset-0 bg-[#05070f]/98 backdrop-blur-3xl z-40 menu-hidden flex flex-col overflow-y-auto px-6 py-12">
            <div class="max-w-md mx-auto w-full pt-6 pb-16 space-y-8">
                <div class="flex items-center justify-between border-b border-white/10 pb-4">
                    <span class="text-xs uppercase tracking-[0.3em] text-turquoise-400 font-mono font-medium">Navigation Hub</span>
                    <button onclick="toggleMobileMenu()" class="w-9 h-9 rounded-full border border-white/10 bg-white/5 flex items-center justify-center text-slate-300 hover:bg-white/10 cursor-pointer">✕</button>
                </div>

                <!-- 1. ABOUT -->
                <div class="space-y-3">
                    <span class="text-[11px] font-mono text-turquoise-400 uppercase tracking-widest block">🌐 1. About</span>
                    <nav class="flex flex-col space-y-2.5 pl-3 border-l border-white/10 text-base font-light text-slate-300">
                        <a href="#home" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Home</a>
                        <a href="#about" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">About</a>
                        <a href="#vision" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Vision</a>
                        <a href="#mission" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Mission</a>
                        <a href="#manifesto" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Manifesto</a>
                    </nav>
                </div>

                <!-- 2. ACTION -->
                <div class="space-y-3">
                    <span class="text-[11px] font-mono text-amber-400 uppercase tracking-widest block">🤝 2. Action</span>
                    <nav class="flex flex-col space-y-2.5 pl-3 border-l border-white/10 text-base font-light text-slate-300">
                        <a href="#humanitarian" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Humanitarian Action</a>
                        <a href="#projects" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Projects</a>
                        <a href="#volunteers" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Volunteers</a>
                        <a href="#academy" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Academy</a>
                        <a href="#media" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Media</a>
                    </nav>
                </div>

                <!-- 3. NETWORK -->
                <div class="space-y-3">
                    <span class="text-[11px] font-mono text-pink-400 uppercase tracking-widest block">🛍️ 3. Network</span>
                    <nav class="flex flex-col space-y-2.5 pl-3 border-l border-white/10 text-base font-light text-slate-300">
                        <a href="#marketplace" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Marketplace</a>
                        <a href="#merchandise" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Merchandise</a>
                        <a href="#partners" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Partners</a>
                        <a href="#contact" onclick="toggleMobileMenu()" class="hover:text-turquoise-400 transition-colors">Contact</a>
                    </nav>
                </div>
            </div>
        </div>

        <!-- İÇERİK ALANI -->
        <main class="flex-grow flex items-center justify-center text-center px-6 py-20">
            <div class="max-w-xl space-y-4">
                <span class="text-xs font-mono text-turquoise-400 tracking-widest uppercase">Header & Brand Glow Locked</span>
                <h2 class="text-2xl font-light text-white">Logo ve Marka Kimliği Tam İstendiği Gibi.</h2>
            </div>
        </main>

    </div>

    <!-- JAVASCRIPT KONTROLLERİ -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            const langDropdown = document.getElementById('langDropdown');
            if(langDropdown) { langDropdown.classList.remove('lang-visible'); langDropdown.classList.add('lang-hidden'); }

            if (menu.classList.contains('menu-hidden')) {
                menu.classList.remove('menu-hidden');
                menu.classList.add('menu-visible');
                document.body.style.overflow = 'hidden';
            } else {
                menu.classList.remove('menu-visible');
                menu.classList.add('menu-hidden');
                document.body.style.overflow = 'auto';
            }
        }

        function toggleLangMenu() {
            const langDropdown = document.getElementById('langDropdown');
            if (langDropdown.classList.contains('lang-hidden')) {
                langDropdown.classList.remove('lang-hidden');
                langDropdown.classList.add('lang-visible');
            } else {
                langDropdown.classList.remove('lang-visible');
                langDropdown.classList.add('lang-hidden');
            }
        }

        function setLanguage(lang) {
            toggleLangMenu();
        }

        window.addEventListener('click', function(e) {
            const langDropdown = document.getElementById('langDropdown');
            const langBtn = document.querySelector('button[aria-label="Language Selector"]');
            if (langDropdown && !langDropdown.contains(e.target) && !langBtn.contains(e.target)) {
                langDropdown.classList.remove('lang-visible');
                langDropdown.classList.add('lang-hidden');
            }
        });
    </script>
</body>
</html>
